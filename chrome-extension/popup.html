<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 320px; padding: 16px; font-size: 13px; color: #333; }
    h2   { margin: 0 0 4px; font-size: 15px; color: #1a73e8; }
    p    { margin: 0 0 12px; font-size: 11px; color: #666; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input[type="file"] { width: 100%; font-size: 12px; margin-bottom: 10px; }
    .row { display: flex; gap: 6px; margin-bottom: 4px; }
    button {
      flex: 1; padding: 8px 4px; border: none;
      border-radius: 4px; font-size: 12px; cursor: pointer;
    }
    #archiveBtn   { background: #1a73e8; color: white; }
    #unarchiveBtn { background: #188038; color: white; }
    #stopBtn      { background: #d93025; color: white; flex: 0 0 60px; display: none; }
    button:disabled { opacity: 0.45; cursor: default; }
    #status {
      margin-top: 10px; padding: 8px; background: #f8f9fa;
      border-radius: 4px; font-size: 12px; min-height: 48px;
      white-space: pre-wrap; word-break: break-all;
    }
    progress { width: 100%; height: 7px; margin-top: 8px; }
    #pct { font-size: 11px; color: #666; text-align: right; }
  </style>
</head>
<body>
  <h2>📷 Google Photos Cleaner</h2>
  <p>Load <strong>albummed_takeout.csv</strong> for both Archive and Unarchive steps.</p>

  <label>CSV file</label>
  <input type="file" id="csvFile" accept=".csv">

  <div class="row">
    <button id="archiveBtn"   disabled>📦 Archive All</button>
    <button id="unarchiveBtn" disabled>📂 Unarchive All</button>
    <button id="stopBtn">⏹</button>
  </div>

  <progress id="bar" value="0" max="100"></progress>
  <div id="pct">—</div>
  <div id="status">Load albummed_takeout.csv to begin.</div>

  <script src="popup.js"></script>
</body>
</html>
